packages:
  - 'e2e'

catalogs:
  eslint:
    eslint: 10.13.0
    '@eslint/js': 10.0.1
    globals: 17.13.0

    typescript-eslint: 8.72.1
    '@stylistic/eslint-plugin': 5.10.0
    eslint-plugin-perfectionist: 5.13.0
    eslint-plugin-wdio: 10.1.0

  types:
    obsidian: 1.14.4
    electron: 43.8.3

    '@types/istanbul-lib-instrument': 1.7.8
    '@types/node': 26.6.6

    '@types/istanbul-lib-coverage': 2.0.6
    '@types/istanbul-lib-report': 3.0.3
    '@types/istanbul-lib-source-maps': 4.0.4
    '@types/istanbul-reports': 3.0.4

  testing:
    vitest: 5.0.5
    '@vitest/coverage-v8': 5.0.5

  devScripting:
    enquirer: 2.4.1
    istanbul-lib-coverage: 3.2.2
    istanbul-lib-instrument: 6.0.3
    istanbul-lib-report: 3.0.1
    istanbul-lib-source-maps: 5.0.6
    istanbul-reports: 3.2.0
    obsidian-utils: 0.10.2

  devTools:
    typescript: 6.0.3
    esbuild: 0.28.2

  wdio:
    webdriverio: 10.1.0
    expect-webdriverio: 8.0.0

    '@wdio/cli': 10.1.0
    '@wdio/electron-service': 10.4.1
    '@wdio/globals': 10.1.0
    '@wdio/local-runner': 10.1.0
    '@wdio/mocha-framework': 10.1.0
    '@wdio/spec-reporter': 10.1.0

    'yauzl': 3.4.0

allowBuilds:
  edgedriver: false
  electron: false
  esbuild: false
  geckodriver: false

minimumReleaseAgeExclude:
  - expect-webdriverio@8.0.0
